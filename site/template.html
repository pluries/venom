<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page_title}} · {{site_title}}</title>
<meta name="description" content="{{description}}">
{{alternates}}
{{head_links}}
{{scripts}}
<link rel="stylesheet" href="{{assets}}style.css">
</head>
<body data-ui="{{data_ui}}">
<a class="skip" href="#main">{{ui_skip}}</a>
{{topbar}}
{{banners}}
<div class="layout wrap-wide">
{{menu_button}}
<aside class="side" id="sidebar"><nav aria-label="{{ui_pages_aria}}">{{sidebar}}</nav></aside>
<main class="prose" id="main"{{main_lang}}>
{{content}}
{{prev_next}}
</main>
<nav class="toc" aria-label="{{ui_on_this_page}}">{{toc}}</nav>
</div>
<footer class="foot"><div class="wrap-wide"><span>{{ui_footer_notice}} <a href="https://github.com/ovh/venom">{{ui_footer_upstream}}</a> · <a href="https://github.com/pluries/venom/blob/main/LICENSE">{{ui_footer_licence}}</a></span><a href="https://github.com/pluries/venom">github.com/pluries/venom</a></div></footer>
</body>
</html>
