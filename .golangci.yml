version: "2"

run:
  # enables gomod and disable changing of go.mod file
  modules-download-mode: readonly

  # default concurrency is a available CPU number
  concurrency: 4

  # timeout for analysis, e.g. 30s, 5m, default is 1m
  timeout: 2m

linters:
  default: none
  enable:
    - govet
    - errcheck
    - gocyclo
    - ineffassign
    # structcheck, varcheck and deadcode (v1) were folded into unused (v2)
    - unused
    # golint (v1, removed upstream) is replaced by revive
    - revive
    # interfacer (v1) had no v2 replacement; dropped
    - unconvert
    - goconst
    - staticcheck
    # gosimple and megacheck (v1) are now part of staticcheck
    - dupl
    - gosec
    - lll
    - gocritic
    # nolintlint keeps suppression honest: a directive that covers nothing is reported, and a bare
    # //nolint without a linter name or a reason is a finding. #2016 AC-6 depends on it — without it,
    # "the backlog reached zero" can mean "everything was silenced" (#2027).
    - nolintlint

  settings:
    errcheck:
      # report about not checking of errors in type assetions: `a := b.(MyStruct)`;
      check-type-assertions: true
      # report about assignment of errors to blank identifier: `num, _ := strconv.Atoi(numStr)`;
      check-blank: true
    govet:
      # `shadow` was enabled here by the v1 → v2 migration (#2013), carried over from the old
      # check-shadowing: true. Nobody had judged it: it is not in govet's default analyzer set, and it
      # accounted for 43 of this repository's 49 govet findings. Dropped in #2027 as inherited
      # configuration rather than inherited code. Re-enable it with a deliberate decision, not by
      # copying a v1 file.
    gocyclo:
      # minimal code complexity to report, 30 by default (but we recommend 10-20)
      min-complexity: 15
    lll:
      # max line length, lines longer will be reported. Default is 120.
      # '\t' is counted as 1 character by default, and can be changed with the tab-width option
      line-length: 200
    # unused: v1's check-exported: false (don't flag unused exported identifiers) is v2's
    # default (exported-fields-are-used: true) — no settings needed to keep the same behaviour.
    # unparam, nakedret and prealloc had settings in the v1 file but were never in its enable
    # list, so they were inert — kept inert here too (settings carried over, still not enabled).
    nolintlint:
      allow-unused: false        # a directive that suppresses nothing is dead weight — report it
      require-explanation: true  # //nolint:errcheck alone says nothing to the next reader
      require-specific: true     # a bare //nolint silences linters nobody chose to silence
    unparam:
      # Inspect exported functions, default is false. Set to true if no external program/library imports your code.
      check-exported: true
    nakedret:
      # make an issue if func has more lines of code than this setting and it has naked returns
      max-func-lines: 60
    prealloc:
      # Report preallocation suggestions only on simple loops that have no returns/breaks/continues/gotos in them.
      simple: true
      range-loops: true # Report preallocation suggestions on range loops
      for-loops: false # Report preallocation suggestions on for loops

  exclusions:
    # v1's issues.exclude-use-default: true — the same default exclude patterns, named explicitly in v2
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    rules:
      # Test files: a repeated literal in a table test is the point of the test, and a long table row
      # is easier to read whole. goconst reported 50 findings here and every one was in a _test.go;
      # dupl 10 of 14; lll 4 of 5 (#2027).
      #
      # Deliberately NOT excluded from test files: staticcheck, errcheck and govet. SA4003 in
      # executors/mqtt/mqtt_test.go:383 is a comparison that is always true — a test asserting less
      # than it appears to. That is exactly what a blanket test exclusion would hide.
      - path: _test\.go
        linters:
          - goconst
          - dupl
          - lll

      # gosec G705 (XSS by taint analysis) in test files only: a fake server that answers a loopback client
      # with canned JSON has no browser to attack. The finding came and went between two Jenkins runs of
      # identical code (develop #208 passed, #209 failed on executors/mobile/fake_server_test.go:127), and
      # nolintlint (allow-unused: false) makes a directive fail the runs where gosec stays quiet (#2396).
      - path: _test\.go
        linters:
          - gosec
        text: "G705"

formatters:
  enable:
    - gofmt
