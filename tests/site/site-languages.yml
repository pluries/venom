name: Site languages in a browser
# Reference web recipe of spec 014 and browser suite of spec 013-site-languages (US1-AS1, US1-AS8, US1-AS14, D-026).
# Not run by `make integration-test` (its glob is tests/*.yml): it needs the built site.
#   make site-preview                                   (or: python scripts/build_site.py --out build/site --preview-languages fr,de,it,es,zh)
#   python -m http.server 8000 --directory build/site   (any server of the build folder)
#   venom run tests/site/site-languages.yml --var appUrl=http://localhost:8000
# Check it without a browser: venom recipe check --specs-dir docs/specs tests/site/site-languages.yml
# The width cases read scrollWidth and clientWidth through `execute`: a page that scrolls sideways at 320 px makes the
# difference positive and the case fail. The negative control of those cases is a copy that expects 1.
vars:
  spec: 013-site-languages
  appUrl: http://localhost:8000
  web:
    driver: chrome
    width: 320
    height: 800
    headless: true
testcases:
- name: US1-AS1 the English home page lists six languages and marks English
  steps:
  - type: web
    action:
      navigate:
        url: "{{.appUrl}}/"
  - type: web
    action:
      find: .lang-panel a
    assertions:
    - result.find ShouldEqual 6
  - type: web
    action:
      find: .lang-current
    assertions:
    - result.text ShouldEqual English

- name: US1-AS1 the French home page lists six languages and marks Français
  steps:
