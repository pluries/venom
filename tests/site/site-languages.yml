- name: US1-AS8 Chinese search finds a one-character term
  steps:
  - type: web
    action:
      navigate:
        url: "{{.appUrl}}/zh/"
  - type: web
    action:
      click:
        find: .search-button
  - type: web
    action:
      fill:
      - find: .search-input
        text: "步"
  - type: web
    action:
      find: .search-hit
    assertions:
    - result.find ShouldBeGreaterThan 0

