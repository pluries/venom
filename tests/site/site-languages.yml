- name: US1-AS14 the English home page does not scroll sideways at 320 px
  steps:
  - type: web
    action:
      navigate:
        url: "{{.appUrl}}/"
  - type: web
    action:
      execute:
        command: "return document.documentElement.scrollWidth - document.documentElement.clientWidth;"
    assertions:
    - result.valuejson ShouldEqual 0

