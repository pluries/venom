name: Defect RC05
# Planted defect of spec 014: this folder yields RC05 and no other rule (see ../README.md).
vars:
  spec: 014-web-mobile-recipes
  appUrl: http://localhost:8000
testcases:
- name: US1-AS1 the page loads and nothing is read
  steps:
  - type: web
    action:
      navigate:
        url: "{{.appUrl}}"
  - type: web
    action:
      find: '[data-test="heading"]'
    assertions:
    - result.err ShouldBeNil
