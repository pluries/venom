name: Defect RC04
# Planted defect of spec 014: this folder yields RC04 and no other rule (see ../README.md).
# The scenario US1-AS2 is named here, in a comment, and no testcase starts with it.
vars:
  spec: 014-web-mobile-recipes
  appUrl: http://localhost:8000
testcases:
- name: US1-AS1 the heading is shown
  steps:
  - type: web
    action:
      navigate:
        url: "{{.appUrl}}"
  - type: web
    action:
      find: '[data-test="heading"]'
    assertions:
    - result.find ShouldEqual 1
